<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PicklePal Lite | Round Robin Play</title>
    <meta http-equiv="refresh" content="2; url=index.html?mode=round-robin">
    <style>
        :root { color-scheme:dark; --bg:#020617; --card:#1e293b; --text:#f8fafc; --muted:#94a3b8; --accent:#3b82f6; --success:#22c55e; --border:rgba(255,255,255,.16); }
        * { box-sizing:border-box; }
        body { min-height:100dvh; margin:0; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at top right,rgba(59,130,246,.18),transparent 48%), var(--bg); color:var(--text); font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
        main { width:min(440px,100%); padding:28px; border:1px solid var(--border); border-radius:16px; background:linear-gradient(145deg,rgba(30,41,59,.88),rgba(15,23,42,.94)); box-shadow:0 24px 60px rgba(0,0,0,.28); }
        h1 { margin:0 0 10px; font-size:clamp(1.8rem,8vw,2.7rem); line-height:1; }
        p { margin:0 0 18px; color:var(--muted); line-height:1.55; font-weight:700; }
        .status { display:flex; align-items:center; gap:9px; margin-bottom:18px; padding:12px 14px; border:1px solid rgba(34,197,94,.34); border-radius:8px; background:rgba(34,197,94,.12); color:#bbf7d0; font-size:.82rem; font-weight:900; }
        .status::before { content:""; width:9px; height:9px; border-radius:50%; background:var(--success); box-shadow:0 0 12px var(--success); }
        a { display:inline-flex; align-items:center; justify-content:center; width:100%; min-height:48px; padding:12px 16px; border-radius:10px; background:linear-gradient(135deg,#06b6d4,#3b82f6,#a855f7); color:#fff; font-weight:900; text-decoration:none; }
        a:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
    </style>
    <script>
        setTimeout(() => location.replace('index.html?mode=round-robin'), 150);
    </script>
</head>
<body>
    <main>
        <div class="status">Opening Round Robin workspace</div>
        <h1>Round Robin Play</h1>
        <p>Loading the dedicated casual-play workspace. If the app does not move automatically, continue below.</p>
        <a href="index.html?mode=round-robin">Open Round Robin</a>
    </main>
</body>
</html>
